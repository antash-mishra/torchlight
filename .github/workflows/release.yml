# Publish a release when a version tag (v0.1.0) is pushed: test, lint and build the .deb on
# Ubuntu 24.04, attach it to a GitHub release, add it to the signed APT repository on GitHub
# Pages (which installed copies update from), then, on a clean machine, install the previous
# release and update it from the repository as the update manager would. See
# docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^#define TORCHLIGHT_VERSION "\(.*\)"$/\1/p' include/torchlight/version.h)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version in include/torchlight/version.h"
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libsqlite3-dev libutf8proc-dev libgtk-4-dev libglib2.0-dev libx11-dev \
            dpkg-dev clang-tidy cppcheck dbus-daemon dbus-session-bus-common

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0

      - name: Test
        run: |
          # AddressSanitizer needs the address-space randomization of older kernels.
          sudo sysctl -w vm.mmap_rnd_bits=28
          make test

      - name: Lint
        run: make lint

      - name: Check repository publishing
        run: make test-packaging

      - name: Build the package
        run: make deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/deb/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # This version's section of the changelog, without its heading.
          awk -v heading="## $version " 'index($0, "## ") == 1 { show = index($0, heading) == 1; next } show' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          # A re-run after a later step failed finds the release already made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb --title "Torchlight $version" --notes-file notes.md
          fi

      - name: Add it to the APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
          test -n "$APT_SIGNING_KEY" || { echo "The APT_SIGNING_KEY secret is not set"; exit 1; }
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          git fetch origin gh-pages
          git worktree add site origin/gh-pages
          git -C site checkout -B gh-pages
          packaging/deb/publish_apt.sh site dist/*.deb
          git -C site add -A
          git -C site -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish $GITHUB_REF_NAME"
          git -C site push origin gh-pages

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Install the previous release, as an existing user has it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest release before this one; none for the first release.
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 \
            --json tagName --jq "[.[].tagName | select(. != \"$GITHUB_REF_NAME\")][0] // empty")
          echo "Previous release: ${previous:-none}"
          mkdir -p previous current
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir current
          sudo apt-get update
          if [ -n "$previous" ]; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous
            sudo apt-get install -y ./previous/torchlight_*.deb
          else
            sudo apt-get install -y ./current/torchlight_*.deb
          fi
          test -f /etc/apt/sources.list.d/torchlight.sources
          torchlight --version

      - name: Update from the APT repository, as the update manager does
        run: |
          version=${GITHUB_REF_NAME#v}
          # GitHub Pages deploys the pushed branch within a few minutes.
          for attempt in $(seq 1 40); do
            if sudo apt-get update --error-on=any >/dev/null 2>&1 &&
               apt-cache madison torchlight | grep -q "$version .*antash-mishra.github.io/torchlight/apt"; then
              break
            fi
            sleep 15
          done
          sudo apt-get update --error-on=any
          apt-cache policy torchlight
          sudo apt-get install -y torchlight
          test "$(dpkg-query -W -f='${Version}' torchlight)" = "$version"
          torchlight --version | grep -qx "torchlight $version"
          torchlightd --version
          test -f /usr/share/gnome-shell/extensions/torchlight@antash-mishra.github.io/metadata.json
          test -f /usr/share/cinnamon/extensions/torchlight@antash-mishra.github.io/extension.js
