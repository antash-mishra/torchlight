# Publish a release when a version tag (v0.1.0) is pushed: test, lint and build the .deb and
# the portable archive on Ubuntu 24.04, install and run the archive on other distributions,
# attach both to a GitHub release, add the .deb to the signed APT repository on GitHub Pages
# (which installed copies update from), then, on a clean machine, install the previous
# release and update it from the repository as the update manager would. Run by hand
# (workflow_dispatch), it builds and checks without publishing. See docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^#define TORCHLIGHT_VERSION "\(.*\)"$/\1/p' include/torchlight/version.h)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version in include/torchlight/version.h"
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libsqlite3-dev libutf8proc-dev libgtk-4-dev libglib2.0-dev libx11-dev \
            dpkg-dev clang-tidy cppcheck dbus-daemon dbus-session-bus-common

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0

      - name: Test
        run: |
          # AddressSanitizer needs the address-space randomization of older kernels.
          sudo sysctl -w vm.mmap_rnd_bits=28
          make test

      - name: Lint
        run: make lint

      - name: Check repository publishing
        run: make test-packaging

      - name: Build the package and the portable archive
        run: make deb tarball

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: build/portable/*.tar.gz
          if-no-files-found: error

  # The portable archive on the oldest supported GTK (Ubuntu 24.04's 4.14) and on other
  # distributions, installed and run by an ordinary user as tests/check_portable.sh does.
  portable:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            setup: apt-get update && apt-get install -y --no-install-recommends libgtk-4-1 procps xvfb xdotool dbus-daemon
          - name: Debian 13
            image: debian:trixie
            setup: apt-get update && apt-get install -y --no-install-recommends libgtk-4-1 procps xvfb xdotool dbus-daemon
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y gtk4 tar gzip procps-ng util-linux shadow-utils /usr/bin/Xvfb /usr/bin/xdotool /usr/bin/dbus-run-session
          - name: Arch Linux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm gtk4 xorg-server-xvfb xdotool dbus procps-ng
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            setup: zypper --non-interactive install libgtk-4-1 tar gzip procps util-linux shadow xorg-x11-server-Xvfb xdotool dbus-1-daemon
    name: Portable archive on ${{ matrix.name }}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install GTK 4 and the check's tools
        run: ${{ matrix.setup }}

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: portable
          path: dist

      - name: Install, search, open the popup and uninstall, as an ordinary user
        run: |
          useradd --create-home tester
          chmod -R a+rX dist tests
          runuser -u tester -- env TORCHLIGHT_CHECK_POPUP=required \
            sh tests/check_portable.sh dist/torchlight-*.tar.gz

  publish:
    needs: [build, portable]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # This version's section of the changelog, without its heading.
          awk -v heading="## $version " 'index($0, "## ") == 1 { show = index($0, heading) == 1; next } show' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          (cd dist && sha256sum *.deb *.tar.gz > SHA256SUMS)
          # A re-run after a later step failed finds the release already made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
              --title "Torchlight $version" --notes-file notes.md
          fi

      - name: Add it to the APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
          test -n "$APT_SIGNING_KEY" || { echo "The APT_SIGNING_KEY secret is not set"; exit 1; }
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          git fetch origin gh-pages
          git worktree add site origin/gh-pages
          git -C site checkout -B gh-pages
          packaging/deb/publish_apt.sh site dist/*.deb
          git -C site add -A
          git -C site -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish $GITHUB_REF_NAME"
          git -C site push origin gh-pages

  verify:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Install the previous release, as an existing user has it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest release before this one; none for the first release.
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 \
            --json tagName --jq "[.[].tagName | select(. != \"$GITHUB_REF_NAME\")][0] // empty")
          echo "Previous release: ${previous:-none}"
          mkdir -p previous current
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir current
          sudo apt-get update
          if [ -n "$previous" ]; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous
            sudo apt-get install -y ./previous/torchlight_*.deb
          else
            sudo apt-get install -y ./current/torchlight_*.deb
          fi
          test -f /etc/apt/sources.list.d/torchlight.sources
          torchlight --version

      - name: Update from the APT repository, as the update manager does
        run: |
          version=${GITHUB_REF_NAME#v}
          # GitHub Pages deploys the pushed branch within a few minutes.
          for attempt in $(seq 1 40); do
            if sudo apt-get update --error-on=any >/dev/null 2>&1 &&
               apt-cache madison torchlight | grep -q "$version .*antash-mishra.github.io/torchlight/apt"; then
              break
            fi
            sleep 15
          done
          sudo apt-get update --error-on=any
          apt-cache policy torchlight
          sudo apt-get install -y torchlight
          test "$(dpkg-query -W -f='${Version}' torchlight)" = "$version"
          torchlight --version | grep -qx "torchlight $version"
          torchlightd --version
          test -f /usr/share/gnome-shell/extensions/torchlight@antash-mishra.github.io/metadata.json
          test -f /usr/share/cinnamon/extensions/torchlight@antash-mishra.github.io/extension.js
